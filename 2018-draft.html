<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Snake Den</title>
<script>
/* Runs before the body is parsed. If this tab already holds the key we are going to
   replace the whole document anyway, so don't paint the unlock screen at all --
   otherwise it flashes for as long as the browser takes to parse the ciphertext,
   which on the bigger pages is a visible second or two. Cleared again if the stored
   key turns out to be stale. */
try{if(localStorage.getItem('sdk1')||sessionStorage.getItem('sdk1'))
 document.documentElement.className='unlocking';}
catch(e){}
</script>
<style>
html.unlocking body{visibility:hidden}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090b;--surface:#121418;--line:#23262d;--text:#e9ebee;--muted:#888e99;
 --dim:#5d636e;--accent:#e5322d}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;
 align-items:center;justify-content:center;padding:24px;
 font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
 -webkit-font-smoothing:antialiased}
.gate{width:100%;max-width:390px;text-align:center}
.gate img{max-width:min(300px,72vw);height:auto;margin:0 auto 30px;display:block;
 filter:drop-shadow(0 12px 34px rgba(0,0,0,.6))}
.lbl{color:var(--accent);letter-spacing:.2em;font-size:11px;text-transform:uppercase;
 font-weight:700;margin-bottom:18px}
form{display:flex;gap:8px}
.pw{position:relative;flex:1;min-width:0}
input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
 padding:12px 62px 12px 15px;color:var(--text);font-size:15px;font-family:inherit;
 outline:none;transition:.15s}
input:focus{border-color:var(--accent)}
/* Edge stacks its own reveal control otherwise */
input::-ms-reveal,input::-ms-clear{display:none}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;
 border:none;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.08em;
 text-transform:uppercase;padding:7px 9px;cursor:pointer;font-family:inherit;
 transition:.15s;border-radius:6px}
.eye:hover{color:var(--text);background:rgba(255,255,255,.05)}
.eye:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
button{background:var(--accent);border:none;border-radius:9px;padding:12px 20px;
 color:#fff;font-size:13px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;
 cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
button:hover{background:#f04a45}
button:disabled{opacity:.55;cursor:default}
.rm{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;
 color:var(--dim);font-size:12.5px;cursor:pointer;user-select:none}
.rm input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;margin:0}
.msg{min-height:19px;margin-top:12px;font-size:13px;color:var(--accent)}
.hint{color:var(--dim);font-size:12px;margin-top:26px;line-height:1.6}
noscript{color:var(--muted);display:block;margin-top:18px;font-size:13px}
</style></head><body>

<script>
(function(){
 var SALT="0UeMBIlnbrOTG5kTHZHkpw==", IV="0uIJ71hdTbGXldzf", ITER=310000, KEY="sdk1";
 var f=document.getElementById('f'), p=document.getElementById('p'),
     b=document.getElementById('b'), m=document.getElementById('m'),
     t=document.getElementById('t');

 // Show/hide the password, so a typo in a shared password is easy to spot.
 t.addEventListener('click', function(){
  var hidden = p.type === 'password';
  p.type = hidden ? 'text' : 'password';
  t.textContent = hidden ? 'Hide' : 'Show';
  t.setAttribute('aria-label', (hidden ? 'Hide' : 'Show') + ' password');
  t.setAttribute('aria-pressed', hidden ? 'true' : 'false');
  p.focus();
  // put the caret back at the end rather than wherever the click landed
  var v = p.value; p.value = ''; p.value = v;
 });

 // The derived key lives in localStorage when "remember" is ticked, so a new tab or a
 // later visit doesn't re-prompt; sessionStorage otherwise, which dies with the tab.
 // Reads check both.
 function readKey(){
  try{ return localStorage.getItem(KEY) || sessionStorage.getItem(KEY); }
  catch(e){ return null; }
 }
 function writeKey(v, persist){
  try{ (persist?localStorage:sessionStorage).setItem(KEY, v); }catch(e){}
 }
 function clearKey(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  try{ sessionStorage.removeItem(KEY); }catch(e){}
 }

 function bytes(b64){
  var s=atob(b64), a=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
  return a;
 }
 function b64(buf){
  var a=new Uint8Array(buf), s='';
  for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]);
  return btoa(s);
 }

 // PBKDF2 is deliberately slow; do it once and keep the derived key for the tab.
 function derive(pw){
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2',
    false, ['deriveBits']).then(function(k){
   return crypto.subtle.deriveBits(
     {name:'PBKDF2', salt:bytes(SALT), iterations:ITER, hash:'SHA-256'}, k, 256);
  });
 }

 function decrypt(raw){
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
   .then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(IV)}, k,
      bytes(document.getElementById('ct').textContent));
   }).then(function(plain){
    return new TextDecoder().decode(plain);
   });
 }

 function show(htmlText){
  // Swap the document element rather than document.open()/write().
  // write() depends on the parser's state: run it too early and it appends into the
  // unlock screen instead of replacing it, and on a large uncached page it can fail
  // outright. Parsing the plaintext separately and replacing <html> in one move has
  // no such timing dependency, so this works whether or not the parser has finished.
  var doc = new DOMParser().parseFromString(htmlText, 'text/html');
  document.replaceChild(document.importNode(doc.documentElement, true),
                        document.documentElement);
  // Scripts inserted by parsing/importing are inert by spec -- clone each one so the
  // page's own behaviour (sorting, filters, box scores) actually runs.
  var scripts = document.querySelectorAll('script');
  for(var i=0;i<scripts.length;i++){
   var old = scripts[i], s = document.createElement('script');
   if(old.src) s.src = old.src; else s.textContent = old.textContent;
   if(old.type) s.type = old.type;
   old.parentNode.replaceChild(s, old);
  }
  document.documentElement.className='';
 }

 function fail(msg){
  m.textContent=msg; b.disabled=false; p.value=''; p.focus();
 }

 // Already unlocked? Go straight in.
 var saved=readKey();
 if(saved){
  // Two arguments, NOT .then(show).catch(...) -- a trailing .catch would also swallow
  // anything thrown inside show(), which tears the document down with document.write.
  // That made an unrelated hiccup look like a bad key and wiped it, so the next page
  // asked for the password again.
  decrypt(bytes(saved)).then(show, function(){
   // genuinely stale key (the password changed): drop it and let the gate paint
   clearKey();
   document.documentElement.className='';
  });
 }

 f.addEventListener('submit', function(ev){
  ev.preventDefault();
  if(!window.crypto||!crypto.subtle){ fail('This browser can\u2019t unlock the archive.'); return; }
  b.disabled=true; m.textContent='Unlocking\u2026';
  derive(p.value).then(function(raw){
   return decrypt(raw).then(function(htmlText){
    writeKey(b64(raw), document.getElementById('rm').checked);
    show(htmlText);
   });
  }).catch(function(){ fail('Wrong password.'); });
 });
})();
</script>
